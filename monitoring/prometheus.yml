global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts/*.yml

scrape_configs:
  - job_name: torus
    static_configs:
      - targets:
          - validator-0:9090
          - validator-1:9090
          - validator-2:9090
          - validator-3:9090
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: instance

  - job_name: node
    static_configs:
      - targets: ['localhost:9100']
