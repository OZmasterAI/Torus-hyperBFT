# Prometheus alerting rules for Torus consensus metrics.
# These rules use metrics exported by torus-telemetry on :9090/metrics.

groups:
  - name: torus_consensus
    rules:
      - alert: MissedBlocks
        expr: changes(torus_block_height[30s]) == 0 and torus_block_height > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Block production stalled"
          description: >
            torus_block_height has not increased in 30 seconds.
            Check validator logs for consensus errors. Verify peer
            connectivity with torus_peers_connected metric.

      - alert: ConsensusStall
        expr: changes(torus_consensus_view[60s]) == 0 and torus_consensus_view > 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "Consensus view not advancing"
          description: >
            torus_consensus_view has not changed in 60 seconds.
            This indicates consensus is stuck — the node may be
            partitioned from the network or the validator set may
            have lost quorum. Check peer count and network connectivity.

      - alert: SlowBlockBuild
        expr: histogram_quantile(0.99, rate(torus_block_build_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Block build time p99 exceeds 2 seconds"
          description: >
            The 99th percentile block build time has exceeded 2 seconds
            for 5 minutes. This may indicate EVM execution bottlenecks,
            too many transactions per block, or RocksDB compaction pressure.
            Check torus_state_root_compute_seconds and system I/O metrics.

      - alert: HighConsensusRounds
        expr: rate(torus_consensus_rounds_total[5m]) > 2 * rate(torus_consensus_rounds_total[30m] offset 30m)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consensus round rate spiked >2x"
          description: >
            The rate of consensus rounds has more than doubled compared
            to the 30-minute baseline. This may indicate network issues
            causing view timeouts, or Byzantine behavior in the validator set.

      - alert: MempoolBacklog
        expr: (torus_mempool_evm_size + torus_mempool_native_size) > 0 and increase(torus_mempool_evm_size[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mempool backlog growing for 10+ minutes"
          description: >
            The mempool has been continuously growing for over 10 minutes.
            This means transactions are arriving faster than they are being
            included in blocks. Check block production rate and gas limits.
