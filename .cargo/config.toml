[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
jobs = 6

[net]
# Use the system `git` binary for fetches. cargo's built-in fetcher pulls the
# large reth monorepo (git dep, tag v2.0.0) incompletely on fresh machines,
# surfacing as "no matching package named reth-storage-errors".
git-fetch-with-cli = true

[profile.dev]
split-debuginfo = "unpacked"

[env]
# Cache only librocksdb-sys C++ compilation via sccache
CC_librocksdb_sys = "sccache cc"
CXX_librocksdb_sys = "sccache c++"
