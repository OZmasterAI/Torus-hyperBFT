[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Parallel rustc jobs are set PER MACHINE, not here: a `jobs` value in this
# file would override every machine's own setting. Put it in
# ~/.cargo/config.toml on each host, e.g.
#   [build]
#   jobs = 16
# (or CARGO_BUILD_JOBS=N, which wins over both files). A host that sets
# nothing uses all its cores. A release build of the big crates can use
# 1-3 GB per job; run one cargo build or test at a time.

[net]
# Use the system `git` binary for fetches. cargo's built-in fetcher pulls the
# large reth monorepo (git dep, tag v2.0.0) incompletely on fresh machines,
# surfacing as "no matching package named reth-storage-errors".
git-fetch-with-cli = true

[profile.dev]
split-debuginfo = "unpacked"

[env]
# Cache only librocksdb-sys C++ compilation via sccache
CC_librocksdb_sys = "sccache cc"
CXX_librocksdb_sys = "sccache c++"
