[workspace]
resolver = "2"
members = [
    "crates/torus-types",
    "crates/torus-state",
    "crates/torus-evm",
    "crates/torus-core",
    "crates/torus-consensus",
    "crates/torus-bridge",
    "crates/torus-network",
    "crates/torus-rpc",
    "crates/torus-mempool",
    "crates/torus-economics",
    "crates/torus-genesis",
    "crates/torus-telemetry",
    "crates/torus-node",
    "crates/torus-integration-tests",
    "crates/hotstuff_rs",
    "crates/torus-explorer",
    "tools/faucet",
    "tools/wallet",
    "tools/tx-flood",
    "tools/bench-throughput",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# Internal crates
torus-types = { path = "crates/torus-types" }
torus-state = { path = "crates/torus-state" }
torus-evm = { path = "crates/torus-evm" }
torus-core = { path = "crates/torus-core" }
torus-consensus = { path = "crates/torus-consensus" }
torus-bridge = { path = "crates/torus-bridge" }
torus-network = { path = "crates/torus-network" }
torus-rpc = { path = "crates/torus-rpc" }
torus-mempool = { path = "crates/torus-mempool" }
torus-economics = { path = "crates/torus-economics" }
torus-genesis = { path = "crates/torus-genesis" }
torus-telemetry = { path = "crates/torus-telemetry" }
torus-node = { path = "crates/torus-node" }

# Consensus (local fork of hotstuff_rs v0.4.0 with MonadBFT extensions)
hotstuff_rs = { path = "crates/hotstuff_rs" }

# EVM — pinned to 36 to match reth v2.0.0 (revm 37 not yet adopted by reth)
# optional_no_base_fee: exposes CfgEnv::disable_base_fee for the eth_call
# simulation path (D2, S392). Defaults to false — consensus exec unaffected.
revm = { version = "36", features = ["optional_no_base_fee"] }

# Ethereum types (alloy)
alloy-primitives = { version = "1.5", features = ["serde"] }
alloy-consensus = "1.8"
alloy-eips = "1.8"
alloy-rlp = "0.3"

# State / Trie — reth crates are not published to crates.io; pulled from git.
# reth v2.0.0 (Apr 2026) uses revm 36 + alloy-primitives 1.5.6 — compatible with our pins.
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.0.0", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.0.0", default-features = false }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.0.0" }
reth-primitives-traits = "0.1"

# Storage
rocksdb = "0.24"

# Networking
libp2p = { version = "=0.56.0", features = [
    "tokio", "tcp", "noise", "yamux", "quic", "gossipsub", "kad",
    "request-response", "cbor", "identify", "macros", "dns",
] }
# Note: libp2p-allow-block-list and libp2p-connection-limits are always-on deps, not features

# RPC
jsonrpsee = { version = "=0.26.0", features = ["server", "client", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
borsh = { version = "1", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus-client = "0.24"

# Crypto
k256 = "0.13"
sha3 = "0.10"
sha2 = "0.10"
# Erasure coding (Sprint 5 T3.1 — recovery-path RS(k,n) body dissemination scaffold).
# Mature, arbitrary k/n, SIMD-accelerated GF(2^8). Default pick per
# docs/plans/sprint5-erasure-coding.md ("Library" section). galois_8 bounds n<=255,
# far above the 21-validator cap.
reed-solomon-erasure = "6"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["batch"] }
ethnum = "1.5"
# rank-10 (perf): FxHash for order-book indices — never iterated, so hasher
# choice is order-invisible; ~2-4x faster than SipHash on 16/20-byte keys.
rustc-hash = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rpassword = "5"
rand = "0.8"
zeroize = "1"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Testing
proptest = "1"
criterion = "0.5"
tempfile = "3"
