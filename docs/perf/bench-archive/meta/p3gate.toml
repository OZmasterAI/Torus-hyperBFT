[deletable.outside]
note = "the two fresh target dirs, {target_size} apparent (rebuildable with `ozarchy-p3gate-build.sh`), and the build worktrees (clean, detached; `git worktree remove`), on the same condition as Tier A"
target_dirs = ["/home/oz/.cargo-target-p3gate-s2-c88d3073", "/home/oz/.cargo-target-p3gate-m-de1a97c1"]
worktrees = ["/home/oz/projects/wt/p3gate-s2-c88d3073", "/home/oz/projects/wt/p3gate-m-de1a97c1"]

[checks]
# ckpt-timers.txt and validity.txt were written in the analyst session without a saved script (section 61 says so).
produced_by = { "ckpt-timers.txt" = "inline python in the analyst session (summary.json phases + metrics deltas; noted in section 61)", "validity.txt" = "written by hand by the analyst from cells.txt, a-term.txt and the run logs (noted in section 61)", "a-term.txt" = "a-term.py stdout", "arms-soak.txt" = "a-arms.py stdout on cells-soak.json" }

[tools]
# matched-bench/ is c88d3073's tools/matched-bench byte for byte except crash-kill.sh (p3term's copy): keep only that one.
exclude = ["matched-bench/*"]
extra = [
  ["ozarchy-p3gate-tools/matched-bench/crash-kill.sh", "matched-bench/crash-kill.sh"],
]

