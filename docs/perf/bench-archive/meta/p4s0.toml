[tools]
# matched-bench/ is byte for byte d3cba5e2's tools/matched-bench (top-level files checked against the git blobs) with pycache.
# nm.txt is 15.8 MB (Tier A on ozarchy).
exclude = ["matched-bench/*", "nm.txt"]
# stacks.py has one line with a trailing blank (git diff --check).
strip_trailing = ["analyst/scripts/stacks.py"]
# The analyst's scripts live in analyst/scripts/ (not a-*.py), so the default copy misses them; the build md5s are g3s0's.
extra = [
  ["ozarchy-p4s0-run/analyst/scripts/stacks.py", "analyst/scripts/stacks.py"],
  ["ozarchy-p4s0-run/analyst/scripts/step0.py", "analyst/scripts/step0.py"],
  ["ozarchy-p4s0-run/analyst/scripts/timeline.py", "analyst/scripts/timeline.py"],
  ["ozarchy-p4s0-run/analyst/scripts/pool.py", "analyst/scripts/pool.py"],
  ["ozarchy-p4s0-run/analyst/scripts/pool2.py", "analyst/scripts/pool2.py"],
  ["ozarchy-p4s0-run/analyst/scripts/allthreads.py", "analyst/scripts/allthreads.py"],
  ["ozarchy-p4s0-run/analyst/scripts/q.py", "analyst/scripts/q.py"],
  ["ozarchy-p4s0-run/analyst/scripts/tree.py", "analyst/scripts/tree.py"],
  ["ozarchy-p4s0-run/analyst/scripts/blocks.py", "analyst/scripts/blocks.py"],
  ["ozarchy-p4s0-run/analyst/scripts/attrib.py", "analyst/scripts/attrib.py"],
  ["ozarchy-p4s0-run/analyst/scripts/phases.py", "analyst/scripts/phases.py"],
  ["ozarchy-g3s0-build/md5s.txt", "md5s-all.txt"],
]

# Smoke: phases.py on u1 (reads summary.json, sampler.csv and the run's p99-u1-m.json; writes nothing; ~1 s). The perf
# scripts (step0.py, timeline.py, ...) are not smoke-run: they need the Tier A dumps and are heavy. attrib.py / blocks.py are
# not smoke-run: attrib.py writes p99-<cell>.json into its input dir (the run's analyst dir).
[[smoke]]
name = "phases.py on u1 (phases + attribution)"
script = "analyst/scripts/phases.py"
args = ["{bench}/ozarchy-p4s0-300m-u1-m", "u1-m", "{bench}/ozarchy-p4s0-run/analyst"]
timeout = 120
[[smoke.compare]]
want = "analyst/p99-phases.txt"
select = "^(== u1-m |   h=  (439|440|441|442|463) )"
[[smoke.compare]]
want = "analyst/p99-causes.txt"
select = "^(-- u1-m |   \\('(439|440|441|442|463)')"
