exclude = ["matched-bench/*"]
# The analyst's scripts are not named a-*.py, so the default copy misses them; the build md5s are g3s0's.
extra = [
  ["ozarchy-g3-run/analyst/extract.py", "analyst/extract.py"],
  ["ozarchy-g3-run/analyst/stats.py", "analyst/stats.py"],
  ["ozarchy-g3-run/analyst/secondary.py", "analyst/secondary.py"],
  ["ozarchy-g3-run/analyst/writeup.py", "analyst/writeup.py"],
  ["ozarchy-g3s0-build/md5s.txt", "md5s-all.txt"],
]

# Smoke: stats.py, secondary.py and writeup.py read the run's analyst/cells.json (hard-coded read path; they write nothing)
# and the cells' cpu.csv / summary.json; each must reproduce its archived stdout. extract.py is not smoke-run: it writes
# cells.json into the run's analyst dir (hard-coded path); its re-run into a scratch dir is noted in section 65.
[[smoke]]
name = "stats.py (ratios, Welch CIs, all treatments)"
script = "analyst/stats.py"
args = []
timeout = 120
[[smoke.compare]]
want = "analyst/stats.txt"

[[smoke]]
name = "secondary.py (per-arm secondary metrics, load)"
script = "analyst/secondary.py"
args = []
timeout = 120
[[smoke.compare]]
want = "analyst/secondary.txt"

[[smoke]]
name = "writeup.py (section 65 tables)"
script = "analyst/writeup.py"
args = []
timeout = 120
[[smoke.compare]]
want = "analyst/writeup.txt"
