update = '''Item 6 Gate 3 checkpoint (18c, owner design s54): G = pre-item-6 main `199bdc97` (glibc; node `d6b05d8e`), bench backported on branch `bench/g3-base-199bdc97` @ `22d3cc03` (tools/bench-throughput only, old signing, `--cloid-share 0` only; bench `a951801c`; the base sha stays `199bdc97`) vs M = main `d3cba5e2` (Phases 1-3 + step 6, jemalloc compiled in; node `c2fda80f`, bench `ff08433d`); arms goff / moff (oracle off on both: `199bdc97` has no mark aggregation), mon (M oracle on, "as shipped") and gjoff (the G node through an LD_PRELOAD jemalloc wrapper, md5 `e676f703`); binaries from ozarchy-g3s0's build, staged in `ozarchy-g3s0-stage/`; 300 markets, CLOID_SHARE=0, saturated (RATE 76000), commit tail; harness = the `d3cba5e2` worktree; driver `ozarchy-g3-campaign.sh` CAMP=G3 (in `tools/ozarchy-g3-tools/` with its generator and the analyst scripts). Cells: w0 (60 s), r1-r4 in rotated balanced rounds (120 s), reruns r1-r4-gjoff-rerun (extra replicates) and r2-moff-rerun (replaces r2-moff, excluded by the owner). Section 65 is built on `ozarchy-g3-run/analyst/` (`cells.json`, `extract.txt`, `stats.txt`, `secondary.txt`, `writeup.txt`), `cells.tsv`, `handoff.json`, `campaign.log` and the cells' `summary.json`, `agreement.jsonl`, `state-digest-val*.txt`, `node-environ-trie.txt`, `node-preload.txt`, `node-maps-jemalloc.txt`, `cpu.csv`, `mem-samples.txt`, `metrics-after-val*.txt` and `buckets.csv` (keep); the node logs, `tasks.txt` and `sampler.csv` are Tier B.'''

[cells]
heading = '''item 6 Gate 3 checkpoint: goff = pre-item-6 main `199bdc97` (glibc, node `d6b05d8e`, backported bench `a951801c` from `bench/g3-base-199bdc97` `22d3cc03`), moff / mon = main `d3cba5e2` (jemalloc compiled in, node `c2fda80f`, bench `ff08433d`) with the oracle feed off / on, gjoff = the G node behind an LD_PRELOAD jemalloc wrapper (`e676f703`); 300 markets, CLOID_SHARE=0, saturated (RATE 76000), commit tail, tw, Classic, shared NVMe, harness = the `d3cba5e2` worktree; n = 4 per arm in rotated balanced rounds, 120 s; all cells ACCEPT AGREE; r2-moff excluded by the owner (replaced by r2-moff-rerun), GJ reruns are extra replicates, GJ md5 flags are false positives; warm-up w0 and the smoke cells excluded (section 65)'''

[deletable]
note = '''Campaign ozarchy-{camp} (results doc section {section}, plan row {plan_row}): item 6 Gate 3 checkpoint, main `d3cba5e2` vs pre-item-6 main `199bdc97` (backported bench). Section {section} is built on `ozarchy-g3-run/analyst/` (`cells.json`, `extract.txt`, `stats.txt`, `secondary.txt`, `writeup.txt` and the scripts), `ozarchy-g3-run/cells.tsv` / `handoff.json` / `campaign.log` / `cell-step/` and the cells' `summary.json`, `agreement.jsonl`, `state-digest-val*.txt`, `node-environ-trie.txt`, `node-preload.txt`, `node-maps-jemalloc.txt`, `cpu.csv`, `mem-samples.txt`, `metrics-after-val*.txt` and `buckets.csv` (keep; `extract.py` reads all of them, `buckets.csv` for the block time). No Tier A in this campaign's dirs: the binaries are ozarchy-g3s0's (`ozarchy-g3s0-build/`, `ozarchy-g3s0-stage/{g-run,g-je,m-run}`; md5s in `ozarchy-g3s0-build/md5s.txt`), shared with ozarchy-p4s0, whose raw profile needs the staged M node. Keep them while a Gate 3 rerun on these binaries (after Phases 4-5) or a p4s0 re-analysis is possible; G and the backported bench are rebuildable from `199bdc97` / `22d3cc03` with `ozarchy-g3s0-build/build-bg.sh`, M from `d3cba5e2` with `build-m.sh`. Do not run the Tier B rm before the commit-interval p99 attribution follow-up (running on 2026-10-14) is written up: it may read the node logs and `sampler.csv`.'''
