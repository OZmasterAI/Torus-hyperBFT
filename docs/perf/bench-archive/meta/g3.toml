produced_by = { "extract.txt" = "extract.py stdout (re-run for section 65 with the cells.json output in a scratch dir; cells.json byte for byte the analyst's)", "stats.txt" = "stats.py stdout (re-run for section 65; the analyst saved no text outputs)", "secondary.txt" = "secondary.py stdout (re-run for section 65)", "writeup.txt" = "writeup.py stdout (written for section 65)", "handoff-tables.txt" = "the campaign driver's handoff step" }

[tools]
