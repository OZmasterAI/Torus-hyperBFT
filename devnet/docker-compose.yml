      - TORUS_EXEC_TRUST_CACHE=${TORUS_EXEC_TRUST_CACHE:-true}
      - TORUS_ASYNC_BODY_PERSIST=${TORUS_ASYNC_BODY_PERSIST:-false}
      # RH4: durable DA-body hygiene. disable_wal bypasses the WAL for
      # CF_NATIVE_PENDING body puts (bodies are re-obtainable via the
      # /torus/native-da/1.0 pull path, so crash-loss only forces a re-pull);
