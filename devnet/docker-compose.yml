      - TORUS_DA_DISABLE_WAL=${TORUS_DA_DISABLE_WAL:-true}
      - TORUS_DA_BODY_RETENTION=${TORUS_DA_BODY_RETENTION:-128}
    volumes:
      - ./genesis.json:/genesis/genesis.json:ro
      - validator-1-data:/data
    ports:
      - "30334:30334/udp"
      - "8546:8545"
      # RH5 read-only RPC (container 8645) → host 8802.
      - "8802:8645"
      - "9092:9090"
    networks:
      torus-devnet:
        ipv4_address: 172.28.0.11
    depends_on:
      - validator-0

  validator-2:
    image: torus-devnet-node:local
    command:
