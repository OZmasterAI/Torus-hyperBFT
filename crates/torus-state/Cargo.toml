[package]
name = "torus-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torus-types = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
revm = { workspace = true }
rocksdb = { workspace = true }
reth-trie = { workspace = true }
reth-trie-common = { workspace = true }
reth-storage-errors = { workspace = true }
reth-primitives-traits = { workspace = true }
tracing = { workspace = true }
# Running state hash (SHA-256, SHA-NI detected at runtime).
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
# T3.1 erasure-coded body dissemination (recovery-path scaffold). UNCOMPILED here
# (no local toolchain) — see crates/torus-state/src/erasure.rs.
reed-solomon-erasure = { workspace = true }

[features]
# Item 6 Phase 4 step 2: TEST-ONLY. Compiles today's raw R for all five
# resident CFs (`ResidentRows::build`, `Default`), the reference path of the
# step 2 differentials, into non-test builds for other crates' tests (enabled
# from torus-bridge's `test-reference-paths` and its dev-dependencies only).
# Changes no behaviour by itself; no node build reaches it.
test-reference-paths = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
criterion = "0.5"

[[bench]]
name = "erasure"
harness = false
