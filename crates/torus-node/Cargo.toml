[package]
name = "torus-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torus-types = { workspace = true }
torus-state = { workspace = true }
torus-evm = { workspace = true }
torus-core = { workspace = true }
torus-consensus = { workspace = true }
torus-bridge = { workspace = true }
torus-network = { workspace = true }
torus-rpc = { workspace = true }
torus-mempool = { workspace = true }
torus-economics = { workspace = true }
torus-genesis = { workspace = true }
torus-telemetry = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }
# Dedicated gossip-ingest verify pool (T2.1) — never the global pool
rayon = "1"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Types
alloy-primitives = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# Consensus
hotstuff_rs = { workspace = true }
# PhaseCertificate (recovery-PC file) serialization for the torus-unwedge bin.
# Pinned to hotstuff_rs's borsh major (0.10, try_to_vec API) — the workspace
# borsh is v1 and its traits don't match hotstuff_rs types.
borsh = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
