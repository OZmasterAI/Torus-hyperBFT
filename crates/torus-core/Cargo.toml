[package]
name = "torus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torus-types = { workspace = true }
torus-state = { workspace = true }
torus-economics = { workspace = true }
alloy-primitives = { workspace = true }
sha3 = { workspace = true }
rocksdb = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true }
tracing = { workspace = true }

[features]
# Item 6 Phase 2 (plan 9.8): TEST-ONLY. Compiles the frozen reference paths
# (`PositionCache::flush_all_per_row`) into non-test builds so torus-bridge's
# `test-reference-paths` feature can switch to them from other crates' tests.
# Never enabled by a normal dependency: no node build reaches it.
test-reference-paths = []

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Item 6 Phase 5 step 3: the Classic row µbench runs on the node's allocator.
tikv-jemallocator = "0.7"

[[bench]]
name = "order_book"
harness = false
