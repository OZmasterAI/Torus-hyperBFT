[package]
name = "torus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torus-types = { workspace = true }
torus-state = { workspace = true }
torus-economics = { workspace = true }
alloy-primitives = { workspace = true }
sha3 = { workspace = true }
rocksdb = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true }
tracing = { workspace = true }

[features]
# Item 6 Phase 2 (plan 9.8): TEST-ONLY. Compiles the frozen reference paths
# (`PositionCache::flush_all_per_row`) into non-test builds so torus-bridge's
# `test-reference-paths` feature can switch to them from other crates' tests.
# Never enabled by a normal dependency: no node build reaches it.
test-reference-paths = []
# Owner s138: TEST-ONLY. `oracle::test_treat_unmarked_as_marked` lets test
# fixtures written before the never-marked rule (orders on a market without
# any oracle mark are refused) keep trading on unmarked markets. Enabled from
# dev-dependencies only: no node build reaches it.
test-unmarked-markets = []

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# 8k L3.3 microbench (`benches/book_encode.rs`): the node's allocator.
tikv-jemallocator = { version = "0.7" }

[[bench]]
name = "order_book"
harness = false

[[bench]]
name = "book_encode"
harness = false
