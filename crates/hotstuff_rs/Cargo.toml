[package]
name = "hotstuff_rs"
version = "0.4.0"
description = "Forked from parallelchain-io/hotstuff_rs v0.4.0 (Apache-2.0). Extended with MonadBFT tail-fork resistance."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/parallelchain-io/hotstuff_rs"

[dependencies]
base64 = "0.21"
borsh = "0.10"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
fern = "0.6"
log = "0.4"
rand = "0.7"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10"
typed-builder = "0.16.2"
