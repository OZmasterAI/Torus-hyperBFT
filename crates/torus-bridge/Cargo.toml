[package]
name = "torus-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torus-types = { workspace = true }
torus-evm = { workspace = true }
torus-core = { workspace = true }
torus-state = { workspace = true }
torus-economics = { workspace = true }
torus-telemetry = { workspace = true }

ed25519-dalek = { workspace = true }
borsh = { workspace = true }
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-rlp = { workspace = true }
revm = { workspace = true }
rocksdb = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }

[features]
# L3 save-books attribution sub-timers (SaveTimings). µbench-only: production
# builds compile the instrumentation out entirely. Enabled by the
# l3_savebooks_ubench test target below.
save-timings = []
# Item 6 Phase 2 (plan 9.8): TEST-ONLY. Compiles the reference-path switches
# of `NativeExecContext` (`test_cancel_all_full_scan`, `test_flush_per_row`)
# into non-test builds, so torus-consensus's app-level differentials can flip
# them (enabled from its dev-dependencies only). The switches default to off:
# turning the feature on changes no behaviour by itself. No node build reaches
# it (`cargo tree -e features,no-dev -p torus-node -i torus-bridge`).
test-reference-paths = ["torus-core/test-reference-paths"]

[dev-dependencies]
tempfile = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
alloy-eips = { workspace = true }
criterion = { workspace = true }
# Item 6 Phase 2 step 0.2: tests/ubench_hasher.rs (SipHash vs foldhash, P2-5).
# Already in Cargo.lock through hashbrown.
foldhash = "0.2"
# Item 6 Phase 2 (plan 9.8): this crate's own tests reach the core reference
# paths (`PositionCache::flush_all_per_row`) the feature build does.
torus-core = { workspace = true, features = ["test-reference-paths"] }

[[test]]
name = "l3_savebooks_ubench"
required-features = ["save-timings"]

[[bench]]
name = "exec_batch_margin"
harness = false

[[bench]]
name = "exec_batch_trades"
harness = false

[[bench]]
name = "exec_place_batch"
harness = false
